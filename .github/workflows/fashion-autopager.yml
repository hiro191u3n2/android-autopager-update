name: Fashion autopager validation
on:
  push:
    branches: [fix/fashion-autopager-6.41]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: |
          python -m pip -q install playwright==1.55.0 requests beautifulsoup4
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
      - name: Build and verify unrelated source preservation
        run: python scripts/build_fashion.py
      - name: Mobile Chromium pagination fixtures
        run: python tests/test_fashion.py
      - name: Existing Rlab regression tests
        if: success() || failure()
        run: python tests/test_rlab.py
      - name: Read-only live fashion pagination and images
        if: success() || failure()
        run: python tests/test_fashion_live.py
      - name: Commit verified release to feature branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-generic-autopager.user.js Android_Generic_AutoPager_v6.41.js android-generic-autopager.meta.js index.html test-results/*.json
          git diff --cached --quiet || git commit -m 'Build verified fashion userscript v6.41.0 [skip ci]'
          git push origin HEAD:fix/fashion-autopager-6.41
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fashion-6.41-validation
          path: |
            test-results/
            android-generic-autopager.user.js
            android-generic-autopager.meta.js
            src/fashion-autopager.js
            tests/test_fashion*.py
          retention-days: 3
