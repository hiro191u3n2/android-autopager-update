name: Google organic groups and Android WebView validation
on:
  push:
    branches: [fix/google-organic-6.58]
    paths:
      - '.github/workflows/google-organic-6.58.yml'
      - 'src/google-import-layout.js'
      - 'worker/index.js'
      - 'tests/test_google_organic_groups.mjs'
      - 'tests/fixtures/google-organic-groups.mjs'
      - 'tests/android-webview/**'
      - 'package.json'
      - 'index.html'
permissions:
  contents: read
concurrency:
  group: google-organic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify source identity and syntax
        run: |
          test "$(git hash-object Android_Generic_AutoPager_v6.44.js)" = ee0c1d906375c7d34ebc3046719abef10d42c7ae
          git diff --check
          node --check worker/index.js
          node --check src/google-import-layout.js
      - name: Run complete regression suite
        env:
          GOOGLE_ORGANIC_ARTIFACT_DIR: ${{ runner.temp }}/google-organic
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/validation.log"
      - name: Build and verify release package
        run: |
          node scripts/build-release.mjs "$PWD" "$RUNNER_TEMP/android-autopager-release" 6.58.0
          node scripts/verify-release.mjs "$RUNNER_TEMP/android-autopager-release" 6.58.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-organic-v658-validation
          path: |
            ${{ runner.temp }}/validation.log
            ${{ runner.temp }}/google-organic/
            ${{ runner.temp }}/android-autopager-release/
          retention-days: 7
  android-webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated WebView test APK
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          bash tests/android-webview/build.sh "$PWD" "$RUNNER_TEMP/android-webview-build"
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render complete userscript in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: python3 tests/android-webview/run.py "$RUNNER_TEMP/android-webview-build" "$RUNNER_TEMP/android-webview-evidence"
      - name: Print compact visual evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-webview-evidence'
          for name in ['environment.json', 'measurements.json']:
              path = root / name
              if path.exists(): print(name, path.read_text())
          for name in ['control-mixed-light-page2.png', 'current-mixed-light-page2.png']:
              path = root / name
              if path.exists(): print('EVIDENCE_PNG', name, base64.b64encode(path.read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-webview-v658-validation
          path: |
            ${{ runner.temp }}/android-webview-evidence/
            ${{ runner.temp }}/android-webview-build/assets/build-manifest.json
          retention-days: 7
