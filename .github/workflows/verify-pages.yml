name: Verify published userscript
on:
  push:
    branches: [main]
    paths:
      - 'android-generic-autopager.user.js'
      - 'android-generic-autopager.meta.js'
      - 'index.html'
      - '.github/workflows/verify-pages.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Pages serves the exact committed userscript and metadata
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request, hashlib, time, json, re
          base = 'https://hiro191u3n2.github.io/android-autopager-update/'
          names = ['android-generic-autopager.user.js', 'android-generic-autopager.meta.js', 'index.html']
          expected = {name:pathlib.Path(name).read_bytes() for name in names}
          for attempt in range(36):
              report = []
              try:
                  for name in names:
                      url = base + name + '?verify=' + os.environ['GITHUB_SHA'] + '-' + str(attempt)
                      req = urllib.request.Request(url, headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          actual = r.read()
                      if actual != expected[name]:
                          raise ValueError('Pages still differs for ' + name)
                      report.append({'file':name,'url':base+name,'sha256':hashlib.sha256(actual).hexdigest(),'bytes':len(actual)})
                  version = re.search(rb'@version\s+([^\s]+)',expected[names[0]]).group(1).decode()
                  print('PUBLISHED_VERIFIED', version, json.dumps(report))
                  pathlib.Path('pages-verification.json').write_text(json.dumps({'version':version,'commit':os.environ['GITHUB_SHA'],'files':report},indent=2))
                  break
              except Exception as exc:
                  print('DEPLOYMENT_CHECK', attempt+1, str(exc), flush=True)
                  if attempt == 35: raise
                  time.sleep(5)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pages-verification
          path: pages-verification.json
          retention-days: 7
