name: Sumaho debug temp
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sumaho-debug-temp.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare Selenium
        run: python3 -m pip install -q selenium
      - name: Execute full public script on live SumahoDigest
        shell: bash
        run: |
          cat > /tmp/test.py <<'PY'
          import re,time,urllib.request,json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')

          script=fetch('https://hiro191u3n2.github.io/android-autopager-update/android-generic-autopager.user.js')
          print('PUBLIC_VERSION', re.search(r'@version\s+([0-9.]+)',script).group(1))

          opt=Options()
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-gpu')
          opt.add_argument('--window-size=412,915')
          opt.add_argument('--user-agent=Mozilla/5.0 (Linux; Android 16; SM-S948Q) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36')
          d=webdriver.Chrome(options=opt)
          try:
              d.get('https://sumahodigest.com/')
              time.sleep(1)
              d.execute_script("window.__gaErrors=[];window.addEventListener('error',e=>window.__gaErrors.push(String(e.error||e.message)));")
              d.execute_script(script)
              time.sleep(5)
              result=d.execute_script("""
                const c=s=>String(s||'').replace(/[\\s\\u00a0\\u3000]+/g,'').trim();
                const vis=e=>!!e && getComputedStyle(e).display!=='none' && getComputedStyle(e).visibility!=='hidden';
                const targets=[...document.querySelectorAll('h1.list-title')].filter(x=>['Xperia・Sony','Pixel','Galaxy'].includes(c(x.textContent)));
                return {
                  errors:window.__gaErrors||[],
                  hidden637:document.querySelectorAll('.generic-sumahodigest-home-segment-hidden-v637').length,
                  targetCount:targets.length,
                  visibleTargets:targets.filter(vis).map(x=>c(x.textContent)),
                  visibleMore:[...document.querySelectorAll('a.list-more-button')].filter(vis).map(x=>x.href),
                  pagerPages:document.querySelectorAll('.generic-autopager-page').length,
                  sentinel:!!document.querySelector('#generic-autopager-sentinel'),
                  mainText:(document.querySelector('#main')?.innerText||'').slice(-800),
                  status:document.querySelector('#generic-autopager-status-v2')?.textContent||'',
                };
              """)
              print('FULL_RESULT',json.dumps(result,ensure_ascii=False))
          finally:
              d.quit()
          PY
          python3 /tmp/test.py
