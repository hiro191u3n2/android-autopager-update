name: Sumaho debug temp
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sumaho-debug-temp.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare Selenium
        run: python3 -m pip install -q selenium
      - name: Prepublish live regression test v6.38
        shell: bash
        run: |
          timeout 70s python3 -u - <<'PY'
          import re,time,urllib.request,json,sys
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')

          script=fetch('https://raw.githubusercontent.com/hiro191u3n2/android-autopager-update/main/Android_Generic_AutoPager_v6.38.js')
          ver=re.search(r'@version\s+([0-9.]+)',script)
          print('CANDIDATE_VERSION', ver.group(1) if ver else 'none', flush=True)
          assert ver and ver.group(1)=='6.38.0'
          assert 'generic-sumahodigest-home-prehide-v638' in script
          assert 'generic-sumahodigest-home-cleanup-v637' not in script

          opt=Options()
          opt.add_argument('--headless=new')
          opt.add_argument('--no-sandbox')
          opt.add_argument('--disable-gpu')
          opt.add_argument('--disable-dev-shm-usage')
          opt.add_argument('--window-size=412,915')
          opt.add_argument('--user-agent=Mozilla/5.0 (Linux; Android 16; SM-S948Q) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36')
          d=webdriver.Chrome(options=opt)
          d.set_page_load_timeout(40)
          try:
              d.get('https://sumahodigest.com/')
              time.sleep(1)
              before=d.execute_script("""
                return {
                  next:document.querySelector('link[rel~=next]')?.href||'',
                  columns:document.querySelectorAll('#list-columns .list-column').length,
                  more:document.querySelectorAll('#list-wrap a.list-more-button').length
                };
              """)
              print('BEFORE',json.dumps(before,ensure_ascii=False),flush=True)
              assert 'paged=2' in before['next']
              assert before['columns']==3
              assert before['more']>=4

              d.execute_script("window.__gaErrors=[];window.addEventListener('error',e=>window.__gaErrors.push(String(e.error||e.message)));")
              d.execute_script(script)
              time.sleep(2)

              after=d.execute_script("""
                const visible=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden';
                const topMore=document.querySelector('#list-wrap .list-new-entries > .list-more-button-wrap');
                const cols=document.querySelector('#list-columns');
                return {
                  errors:window.__gaErrors||[],
                  style:!!document.querySelector('#generic-sumahodigest-home-prehide-style-v638'),
                  topMoreDisplay:topMore?getComputedStyle(topMore).display:'missing',
                  columnsDisplay:cols?getComputedStyle(cols).display:'missing',
                  visibleMore:[...document.querySelectorAll('#list-wrap a.list-more-button')].filter(visible).length,
                  visibleColumns:[...document.querySelectorAll('#list-columns .list-column')].filter(visible).length,
                  sentinel:!!document.querySelector('#generic-autopager-sentinel'),
                  status:document.querySelector('#generic-autopager-status-v2')?.textContent||''
                };
              """)
              print('AFTER',json.dumps(after,ensure_ascii=False),flush=True)
              assert after['errors']==[]
              assert after['style']
              assert after['topMoreDisplay']=='none'
              assert after['columnsDisplay']=='none'
              assert after['visibleMore']==0
              assert after['visibleColumns']==0
              assert after['sentinel']

              d.execute_script("""
                const s=document.querySelector('#generic-autopager-sentinel');
                if(s){s.scrollIntoView({block:'center'});}
                window.dispatchEvent(new Event('scroll'));
                document.dispatchEvent(new Event('scroll',{bubbles:true}));
              """)
              deadline=time.time()+20
              pages=0
              while time.time()<deadline:
                  pages=d.execute_script("return document.querySelectorAll('.generic-autopager-page').length")
                  if pages>=1: break
                  d.execute_script("window.scrollTo(0,document.documentElement.scrollHeight);window.dispatchEvent(new Event('scroll'));")
                  time.sleep(0.7)

              final=d.execute_script("""
                const visible=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden';
                const page=[...document.querySelectorAll('.generic-autopager-page')];
                return {
                  errors:window.__gaErrors||[],
                  pages:page.length,
                  sources:page.map(x=>x.dataset.sourceUrl||''),
                  page2Cards:page[0]?.querySelectorAll('a.entry-card-wrap,article.entry-card').length||0,
                  visibleMore:[...document.querySelectorAll('#list-wrap a.list-more-button,.generic-autopager-page a.list-more-button')].filter(visible).length,
                  visibleColumns:[...document.querySelectorAll('#list-columns .list-column,.generic-autopager-page #list-columns .list-column')].filter(visible).length,
                  status:document.querySelector('#generic-autopager-status-v2')?.textContent||''
                };
              """)
              print('FINAL',json.dumps(final,ensure_ascii=False),flush=True)
              assert final['errors']==[]
              assert final['pages']>=1
              assert any('paged=2' in x for x in final['sources'])
              assert final['page2Cards']>0
              assert final['visibleMore']==0
              assert final['visibleColumns']==0
              print('RESULT PASS',flush=True)
          finally:
              d.quit()
          PY
