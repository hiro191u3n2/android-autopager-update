name: Sumaho debug temp
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sumaho-debug-temp.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python3 -m pip install -q selenium
      - name: Scroll live page with full public script
        shell: bash
        run: |
          cat > /tmp/test.py <<'PY'
          import re,time,urllib.request,json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')

          script=fetch('https://hiro191u3n2.github.io/android-autopager-update/android-generic-autopager.user.js')
          print('PUBLIC_VERSION', re.search(r'@version\s+([0-9.]+)',script).group(1))

          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-gpu'); opt.add_argument('--window-size=412,915')
          opt.add_argument('--user-agent=Mozilla/5.0 (Linux; Android 16; SM-S948Q) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36')
          d=webdriver.Chrome(options=opt)
          try:
              d.get('https://sumahodigest.com/'); time.sleep(1); d.execute_script(script); time.sleep(2)
              def state(label):
                  x=d.execute_script("""
                    const c=s=>String(s||'').replace(/[\\s\\u00a0\\u3000]+/g,'').trim();
                    const v=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden';
                    const hs=[...document.querySelectorAll('h1.list-title')].filter(x=>['Xperia・Sony','Pixel','Galaxy'].includes(c(x.textContent)));
                    return {
                      hidden:document.querySelectorAll('.generic-sumahodigest-home-segment-hidden-v637').length,
                      visibleTargets:hs.filter(v).map(x=>c(x.textContent)),
                      visibleMore:[...document.querySelectorAll('a.list-more-button')].filter(v).map(x=>x.href),
                      pages:document.querySelectorAll('.generic-autopager-page').length,
                      status:document.querySelector('#generic-autopager-status-v2')?.textContent||'',
                      scrollY:window.scrollY,
                      height:document.documentElement.scrollHeight
                    };
                  """)
                  print(label,json.dumps(x,ensure_ascii=False))
              state('START')
              for i in range(14):
                  d.execute_script("window.scrollBy(0, Math.max(600, window.innerHeight*0.8));")
                  time.sleep(0.8)
                  if i in (2,5,8,11,13): state('STEP'+str(i))
              d.execute_script("window.scrollTo(0, document.documentElement.scrollHeight);"); time.sleep(5); state('BOTTOM')
          finally:
              d.quit()
          PY
          python3 /tmp/test.py
