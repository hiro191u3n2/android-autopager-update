name: Sumaho debug temp
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/sumaho-debug-temp.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch live homepage
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --max-time 30 \
            -A 'Mozilla/5.0 (Linux; Android 16; SM-S948Q) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36' \
            -H 'Accept-Language: ja-JP,ja;q=0.9' \
            https://sumahodigest.com/ -o home.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('home.html').read_text(errors='replace').replace('><','>\n<')
          Path('pretty.html').write_text(s)
          PY
      - name: Show exact home segments
        shell: bash
        run: |
          set -euo pipefail
          echo '=== around latest more ==='
          sed -n '625,650p' pretty.html
          echo '=== around Xperia more ==='
          sed -n '790,825p' pretty.html
          echo '=== around Pixel more ==='
          sed -n '970,1005p' pretty.html
          echo '=== around Galaxy more ==='
          sed -n '1148,1185p' pretty.html
          echo '=== structural names ==='
          grep -n -E 'front-top-page|front-page|list-more-button|Xperia・Sony|>Pixel<|>Galaxy<' pretty.html | tail -80
