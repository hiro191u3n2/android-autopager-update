name: Android Google pagination offline matrix
on:
  push:
    branches: [qa/google-pagination-6.77-emulator]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: '35', target: google_apis, start: 0, end: 49 }
          - { image: '35', target: google_apis, start: 50, end: 99 }
          - { image: '37.0', target: google_apis_ps16k, start: 50, end: 99 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Scroll each fixture to its fifth page in Android WebView
        run: bash tests/query-matrix/run.sh "${{ matrix.image }}" "${{ matrix.target }}" "${{ matrix.start }}" "${{ matrix.end }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-pagination-api-${{ matrix.image }}-${{ matrix.start }}
          path: evidence
