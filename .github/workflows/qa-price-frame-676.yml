name: Verify mobile price frame 6.76
on:
  push:
    branches: [qa/price-frame-676]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate canonical build and mobile browser regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace/sites
          sudo chown "$USER" /workspace/sites
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" /workspace/sites/android-autopager-update
          cd /workspace/sites/android-autopager-update
          git checkout -B main "$GITHUB_SHA"
          git remote set-url origin https://github.com/hiro191u3n2/android-autopager-update.git
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          bash scripts/validate-project.sh 6.76.0
          node scripts/build-release.mjs "$PWD" "$RUNNER_TEMP/release" 6.76.0
          node scripts/verify-release.mjs "$RUNNER_TEMP/release" 6.76.0
          for file in "$RUNNER_TEMP"/release/* "$RUNNER_TEMP"/release/.nojekyll; do cmp "$file" "./$(basename "$file")"; done
      - name: Check whether the public Japanese search currently serves this layout
        working-directory: /workspace/sites/android-autopager-update
        run: node .qa/check-live.mjs
  webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build isolated price-frame fixture
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          bash tests/android-webview/build.sh "$PWD" "$RUNNER_TEMP/price-build" .qa/price-assets.mjs
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure price-frame geometry on Android 17
        run: |
          sed 's|python tests/android-webview/run-mobile-frames.py|python .qa/price-probe.py|' tests/android-webview/run-frame-emulator.sh > "$RUNNER_TEMP/price-emulator.sh"
          bash "$RUNNER_TEMP/price-emulator.sh" '37.0' google_apis_ps16k 37 "$RUNNER_TEMP/price-build" "$RUNNER_TEMP/price-evidence"
