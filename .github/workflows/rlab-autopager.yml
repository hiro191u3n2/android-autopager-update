name: Rlab autopager validation
on:
  push:
    branches: [fix/rlab-autopager-6.40]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: |
          python -m pip -q install playwright==1.55.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
      - name: Build and check unrelated source preservation
        run: python scripts/build_rlab.py
      - name: Mobile Chromium fixture regressions
        run: python tests/test_rlab.py
      - name: Live read-only Rlab pagination checks
        run: python tests/test_rlab_live.py
      - name: Visible appended product images and grid geometry
        run: python tests/test_rlab_visual.py
      - name: Commit verified release to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-generic-autopager.user.js Android_Generic_AutoPager_v6.40.js android-generic-autopager.meta.js index.html test-results/*.json
          git diff --cached --quiet || git commit -m 'Build verified Rlab userscript v6.40.0 [skip ci]'
          git push origin HEAD:fix/rlab-autopager-6.40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlab-6.40-validation
          path: |
            test-results/
            android-generic-autopager.user.js
            android-generic-autopager.meta.js
            src/rlab-autopager.js
          retention-days: 3
