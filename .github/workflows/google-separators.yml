name: Google result separator validation
on:
  push:
    branches: [fix/google-separators-6.54]
    paths:
      - '.github/workflows/google-separators.yml'
      - 'src/google-import-layout.js'
      - 'worker/index.js'
      - 'tests/test_google_separators.mjs'
      - 'package.json'
      - 'index.html'
permissions:
  contents: read
concurrency:
  group: google-separators-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify preserved baseline and source syntax
        run: |
          test "$(git hash-object Android_Generic_AutoPager_v6.44.js)" = ee0c1d906375c7d34ebc3046719abef10d42c7ae
          git diff --check
          node --check worker/index.js
          node --check src/google-import-layout.js
      - name: Run complete regression suite
        env:
          GOOGLE_SEPARATOR_SCREENSHOT: ${{ runner.temp }}/google-separators-v654.png
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/google-separators-validation.log"
      - name: Build and verify release package
        run: |
          node scripts/build-release.mjs "$PWD" "$RUNNER_TEMP/android-autopager-release" 6.54.0
          node scripts/verify-release.mjs "$RUNNER_TEMP/android-autopager-release" 6.54.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-separators-v654-validation
          path: |
            ${{ runner.temp }}/google-separators-validation.log
            ${{ runner.temp }}/google-separators-v654.png
            ${{ runner.temp }}/android-autopager-release/
          retention-days: 7
