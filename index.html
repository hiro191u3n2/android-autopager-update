<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Android 汎用オートページャー 更新</title>
    <style>
      :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color-scheme:light dark}
      *{box-sizing:border-box}
      body{display:grid;min-height:100vh;margin:0;padding:24px;background:#f4f6f8;color:#202124;place-items:center}
      main{width:min(100%,600px);padding:32px;border:1px solid #d8dde3;border-radius:18px;background:#fff;box-shadow:0 12px 32px #20212418}
      h1{margin:0 0 14px;font-size:25px;line-height:1.4}
      p{margin:10px 0;color:#5f6368;line-height:1.7}
      .version{display:inline-block;margin:8px 0 18px;padding:5px 10px;border-radius:999px;background:#e8f0fe;color:#1967d2;font-weight:700}
      a{display:block;margin-top:18px;padding:15px 18px;border-radius:12px;background:#1967d2;color:#fff;text-align:center;text-decoration:none;font-weight:700}
      code{overflow-wrap:anywhere}
      @media(prefers-color-scheme:dark){body{background:#202124;color:#e8eaed}main{border-color:#3c4043;background:#292a2d;box-shadow:none}p{color:#bdc1c6}.version{background:#394457;color:#8ab4f8}a{background:#8ab4f8;color:#202124}}
    </style>
  </head>
  <body>
    <main>
      <h1>Android 汎用オートページャー</h1>
      <span class="version">v6.26.0</span>
      <p>下のボタンを長押ししてリンクをコピーし、AdGuardの「URLまたはファイルパス」へ貼り付けてください。</p>
      <p>今後は同じURLのまま、<code>@version</code>の更新を検出できます。</p>
      <a href="./android-generic-autopager.user.js">ユーザースクリプトを開く</a>
    </main>
  </body>
</html>
